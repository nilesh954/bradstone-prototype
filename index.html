  .search{

  .util span{font-size:13px;line-height:15px;}

  .swatch.sel{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--green);}

  .cta-row{display:flex;gap:16px;margin-bottom:36px;}
  .btn{

    text-align:center;

  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{background:#00400a;border-color:#00400a;}
  .btn-outline{background:transparent;color:var(--green);}
  .btn-outline:hover{background:var(--green);color:#fff;}
  .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;}

  .advisor{display:flex;align-items:flex-start;gap:16px;color:var(--charcoal);font-size:16px;line-height:24px;}
  .advisor .aico{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
  .advisor .aico svg{width:36px;height:36px;}
  .advisor a{color:var(--green);font-weight:600;}

  .spec-links{display:flex;flex-direction:column;gap:14px;margin-top:26px;}

  .nbs-mark b{font-size:16px;font-weight:700;color:#3d2b42;letter-spacing:.02em;}

  .cw-mark{display:inline-flex;align-items:center;gap:7px;}
  .cw-mark svg{width:22px;height:22px;}
  .cw-mark .cw-txt{display:flex;flex-direction:column;line-height:1.05;}
  .cw-mark .cw-txt .c1{font-size:14px;font-weight:700;color:#232f45;}
  .cw-mark .cw-txt .c2{font-size:11px;font-weight:600;color:#40A5D9;}

  /* ===================== RESPONSIVE ===================== */
  @media (max-width:1080px){

    .nav-right{gap:16px;}
    .search{display:none;}
    .cta-row{flex-direction:column;}
    .topbar-tabs a{padding:0 12px;font-size:10px;}
  }
  @media (max-width:600px){

    .info h1{font-size:32px;line-height:36px;}

<html lang="en-GB">
<head>

<title>Sample Cart – Bradstone Commercial</title>

<!-- Bradstone's real Adobe Typekit kit: ivypresto-display (serif headings) + halyard-text (sans body/UI) -->
<link rel="stylesheet" href="https://use.typekit.net/kjz6hbv.css">

<style>
  :root{
    --charcoal:#524D56;
    --green:#005209;
    --dark:#29272B;
    --border:#D4D3D5;
    --line:#E6E5E7;
    --white:#ffffff;
    --sans:"halyard-text",-apple-system,"Segoe UI",Arial,sans-serif;
    --serif:"ivypresto-display",Georgia,"Times New Roman",serif;
    --maxw:1776px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;font-family:var(--sans);font-size:16px;line-height:24px;color:var(--charcoal);background:var(--white);}
  a{color:var(--charcoal);text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 12px;}

  /* ===================== TOP DARK STRIP ===================== */
  .topbar{background:var(--dark);color:#cfced1;}
  .topbar .wrap{display:flex;align-items:stretch;justify-content:space-between;height:36px;}
  .topbar-tabs{display:flex;height:100%;}
  .topbar-tabs a{display:flex;align-items:center;padding:0 20px;height:100%;font-size:11px;letter-spacing:.06em;color:#b7b6ba;text-transform:uppercase;}
  .topbar-tabs a.active{background:#3a383d;color:#fff;}
  .topbar-social{display:flex;align-items:center;gap:18px;padding-right:2px;}
  .topbar-social a{color:#b7b6ba;display:flex;}
  .topbar-social svg{width:15px;height:15px;fill:currentColor;}

  /* ===================== MAIN NAV ===================== */
  .mainnav{border-bottom:1px solid var(--line);background:#fff;}
  .mainnav .wrap{display:flex;align-items:center;gap:28px;height:104px;}
  .logo img{height:34px;width:auto;}
  .primary-links{display:flex;align-items:center;gap:30px;margin-left:8px;}
  .primary-links a{font-size:18px;color:var(--charcoal);display:flex;align-items:center;gap:8px;}
  .primary-links a .caret{width:9px;height:9px;border-right:2px solid #8f8b92;border-bottom:2px solid #8f8b92;transform:rotate(45deg);margin-top:-4px;}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:28px;}
  .search{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:80px;padding:11px 22px;min-width:230px;color:#8f8b92;}
  .search input{border:0;outline:0;background:transparent;font-family:var(--sans);font-size:16px;color:var(--charcoal);width:100%;}
  .search input::placeholder{color:#9a969d;}
  .search svg{width:18px;height:18px;stroke:#8f8b92;fill:none;stroke-width:2;flex:none;}
  .phone{font-size:20px;font-weight:500;color:var(--charcoal);white-space:nowrap;}
  .utils{display:flex;align-items:flex-start;gap:26px;}
  .util{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;color:var(--charcoal);width:74px;}
  .util .ico{height:26px;display:flex;align-items:center;justify-content:center;}
  .util .ico svg,.util .ico img{height:26px;width:auto;}
  .util .ico svg{stroke:var(--charcoal);fill:none;stroke-width:1.4;}
  .util span{font-size:13px;line-height:15px;}

  /* ===================== SAMPLE CART ===================== */
  .sc{padding-top:34px;padding-bottom:72px;}
  .sc-title{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1.1;color:var(--charcoal);margin:8px 0 40px;}
  .sc-title .g{color:var(--green);font-weight:700;}
  .sc-body{display:flex;align-items:flex-start;gap:clamp(32px,4vw,60px);}

  /* left: cart */
  .sc-cart{flex:1 1 auto;min-width:0;}
  .sc-thead{display:grid;grid-template-columns:1fr 130px 130px 150px;gap:20px;padding:0 28px 14px;font-size:15px;font-weight:700;color:var(--charcoal);text-transform:uppercase;letter-spacing:.01em;}
  .sc-thead .c-price,.sc-thead .c-qty{text-align:center;}
  .sc-thead .c-sub{text-align:right;}

  /* bordered item card */
  .sc-card{border:1px solid #E3E2E5;border-radius:8px;padding:28px;}
  .sc-row{display:grid;grid-template-columns:1fr 130px 130px 150px;gap:20px;align-items:center;}
  .sc-item-cell{display:flex;gap:26px;}
  .sc-thumb{flex:none;width:120px;height:120px;border-radius:6px;overflow:hidden;background:#efeef0;}
  .sc-thumb img{width:100%;height:100%;object-fit:cover;}
  .sc-info .name{font-size:16px;font-weight:700;text-transform:uppercase;color:var(--charcoal);margin:0 0 12px;}
  .sc-info .attr{font-size:16px;color:var(--charcoal);margin:0 0 6px;}
  .sc-info .attr b{font-weight:700;}
  .c-price,.c-sub{font-size:16px;font-weight:700;color:var(--charcoal);}
  .c-price{text-align:center;}
  .c-sub{text-align:right;}
  .c-qty{display:flex;justify-content:center;}
  .qty-input{width:96px;height:48px;text-align:center;border:1px solid var(--border);border-radius:50px;font-family:var(--sans);font-size:16px;color:var(--charcoal);outline:none;}
  .qty-input:focus{border-color:var(--green);}
  .m-label{display:none;}

  .card-actions{display:flex;justify-content:flex-end;padding-top:22px;margin-top:26px;border-top:1px solid #ebeaec;}
  .remove-link{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--charcoal);cursor:pointer;}
  .remove-link:hover{color:var(--green);}
  .remove-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex:none;}

  /* bottom actions */
  .sc-actions{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:26px;flex-wrap:wrap;}
  .btn-continue{display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #E3E2E5;border-radius:80px;padding:15px 30px;font-family:var(--sans);font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.01em;color:var(--charcoal);cursor:pointer;transition:background-color .18s,border-color .18s;}
  .btn-continue:hover{background:#f7f7f8;border-color:#d4d3d5;}
  .btn-dark,.btn-light{display:inline-flex;align-items:center;gap:13px;border:0;border-radius:80px;padding:14px 26px;font-family:var(--sans);font-size:15px;font-weight:400;text-transform:uppercase;letter-spacing:.01em;cursor:pointer;transition:background-color .18s;}
  .btn-dark{background:var(--charcoal);color:#fff;}
  .btn-dark:hover{background:#3f3b43;}
  .btn-light{background:#F4F4F5;color:var(--charcoal);}
  .btn-light:hover{background:#e8e7ea;}
  .btn-dark svg,.btn-light svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none;}
  .btn-arw{margin-left:4px;}
  /* summary continue link (text + chevron) */
  .continue-link{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:600;text-transform:uppercase;color:var(--charcoal);cursor:pointer;}
  .continue-link:hover{color:var(--green);}
  .continue-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex:none;}

  /* right: summary */
  .sc-summary{flex:0 0 380px;max-width:380px;background:#F4F4F5;border-radius:16px;padding:28px 30px 30px;}
  .summary-title{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;color:var(--charcoal);margin:0 0 6px;padding-bottom:18px;border-bottom:1px solid #dcdbdd;}
  .sum-accordion{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:18px 0;border-bottom:1px solid #dcdbdd;font-family:var(--sans);font-size:18px;font-weight:400;color:var(--charcoal);cursor:pointer;text-align:left;}
  .sum-accordion svg{width:16px;height:16px;stroke:#8a868f;fill:none;stroke-width:2;flex:none;}
  .sum-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #dcdbdd;font-size:16px;color:var(--charcoal);}
  .sum-row.total{border-bottom:0;padding:18px 0 4px;font-size:20px;font-weight:700;}
  .checkout{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#fff;border:0;border-radius:80px;padding:16px 26px;font-family:var(--sans);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;margin-top:20px;transition:background-color .18s;}
  .checkout:hover{background:#00400a;}
  .checkout svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;flex:none;}
  .summary-continue{display:flex;justify-content:center;margin-top:16px;}

  /* ===================== FOOTER ===================== */
  .site-footer{background:#F4F8F0;margin-top:24px;}
  .footer-main{display:flex;gap:60px;padding:56px 0 48px;flex-wrap:wrap;}
  .footer-left{flex:1 1 520px;min-width:300px;}
  .footer-logo{opacity:.5;margin-bottom:26px;}
  .footer-logo img{height:30px;}
  .news-card{background:#fff;border-radius:16px;padding:24px 32px;max-width:570px;text-align:center;}
  .news-card h3{font-size:30px;font-weight:600;color:var(--charcoal);margin:6px 0 12px;}
  .news-card h3 .g{color:#669CEE;}
  .news-card .news-sub{font-size:16px;color:var(--charcoal);margin:0 0 22px;}
  .news-form{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:80px;background:#fff;padding:6px 6px 6px 10px;}
  .news-form input{flex:1;border:0;outline:0;background:transparent;font-family:var(--sans);font-size:16px;color:var(--charcoal);padding:10px 14px;}
  .news-form input::placeholder{color:#9a969d;}
  .subscribe{display:inline-flex;align-items:center;gap:12px;background:var(--charcoal);color:#fff;border:0;border-radius:80px;padding:13px 24px;font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .subscribe svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;}
  .footer-cols{display:flex;gap:56px;flex:1 1 620px;flex-wrap:wrap;padding-top:6px;}
  .fcol h4{font-size:18px;font-weight:700;color:var(--green);text-transform:uppercase;margin:0 0 20px;letter-spacing:.02em;}
  .fcol a{display:block;font-size:16px;color:var(--charcoal);margin-bottom:14px;}
  .fcol a:hover{text-decoration:underline;}
  .footer-bottom{background:#D1E0C2;}
  .footer-bottom .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 0;flex-wrap:wrap;}
  .fb-copy{font-size:15px;color:var(--charcoal);}
  .fb-legal{display:flex;gap:26px;flex-wrap:wrap;}
  .fb-legal a{font-size:15px;color:var(--charcoal);}
  .fb-legal a:hover{text-decoration:underline;}
  .fb-social{display:flex;gap:16px;}
  .fb-social a{color:var(--charcoal);display:flex;}
  .fb-social svg{width:16px;height:16px;fill:currentColor;}

  /* ===================== RESPONSIVE ===================== */
  @media (max-width:1080px){
    .primary-links{display:none;}
    .mainnav .wrap{height:88px;gap:18px;}
  }
  @media (max-width:900px){
    .sc-body{flex-direction:column;gap:36px;}
    .sc-summary{flex-basis:auto;max-width:none;width:100%;}
    .sc-title{font-size:44px;}
    .nav-right{gap:16px;}
    .search{display:none;}
    .topbar-tabs a{padding:0 12px;font-size:10px;}
  }
  @media (max-width:600px){
    .wrap{padding:0 16px;}
    .sc-title{font-size:34px;}
    .sc-thead{display:none;}
    .sc-card{padding:20px;}
    .sc-row{grid-template-columns:1fr;gap:0;}
    .sc-item-cell{padding-bottom:8px;}
    .c-price,.c-qty,.c-sub{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 0;border-top:1px solid var(--line);}
    .c-qty{justify-content:space-between;}
    .m-label{display:inline;font-weight:700;}
    .sc-actions{flex-direction:column;align-items:stretch;gap:14px;}
    .btn-continue{order:3;}
    .btn-dark,.btn-light{justify-content:center;}
    .footer-main{gap:32px;padding:40px 0 32px;}
    .footer-cols{gap:32px;}
    .footer-bottom .wrap{flex-direction:column;align-items:flex-start;gap:12px;}
    .news-card{padding:20px;}
    .news-card h3{font-size:26px;}
  }
</style>
</head>

<style>

  .method-head{font-size:14px;font-weight:600;text-transform:uppercase;color:var(--charcoal);padding-bottom:12px;}
  .method-row{padding:14px 0;font-size:16px;color:var(--charcoal);}

  .co-next:hover{background:#00400a;}
  .co-next svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;flex:none;}

  .co-summary{flex:0 0 620px;max-width:620px;border:1px solid var(--border);border-radius:20px;background:#fff;padding:28px 30px;}
  .sum-item{display:flex;gap:22px;align-items:flex-start;}

  .view-details{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-family:var(--sans);color:var(--green);font-size:16px;font-weight:500;margin-top:18px;cursor:pointer;}
  .view-details svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s ease;}
  .view-details[aria-expanded="true"] svg{transform:rotate(180deg);}
  .sum-details{display:none;margin-top:4px;}
  .sum-details.show{display:block;}

  /* minimal footer */
  .co-foot{border-top:1px solid var(--line);padding:22px 0;text-align:center;font-size:14px;color:#8a868f;}
  .co-foot a{color:#8a868f;margin:0 12px;}

  /* ===================== RESPONSIVE ===================== */

  }
  @media (max-width:600px){

    .method-row .m-title{grid-area:t;}
    .method-row .m-price{grid-area:p;font-weight:700;}
    .method-row .m-carrier{display:none;}
    .co-card{padding:26px 20px;}
  }
</style>

  (function(){
    var BAL=500, RATE=0.01, BASE=4.95;
    var MAXPTS=Math.min(BAL, Math.round(BASE/RATE));
    var applied=0;
    function id(x){return document.getElementById(x);}
    function m(n){return "\u00a3"+n.toFixed(2);}
    function render(){
      var saved=applied*RATE, total=Math.max(0,BASE-saved), worth=document.querySelector(".rp-worth");
      id("rp-total").textContent=m(total);
      if(applied>0){
        id("rp-row").hidden=false;
        id("rp-row-pts").textContent="("+applied+" pts)";
        id("rp-row-val").textContent="\u2212"+m(saved);
        id("rp-controls").style.display="none"; id("rp-max").style.display="none";
        id("rp-done").hidden=false; id("rp-used").textContent=applied; id("rp-saved").textContent="\u2212"+m(saved);
        id("rp-balance").textContent=(BAL-applied); if(worth)worth.textContent="("+m((BAL-applied)*RATE)+")";
      }else{
        id("rp-row").hidden=true; id("rp-controls").style.display=""; id("rp-max").style.display="";
        id("rp-done").hidden=true; id("rp-balance").textContent=BAL; if(worth)worth.textContent="("+m(BAL*RATE)+")";
      }
    }
    function apply(p){p=parseInt(p,10);if(isNaN(p)||p<0)p=0;if(p>MAXPTS)p=MAXPTS;applied=p;render();}
    var ab=id("rp-apply-btn");if(ab)ab.addEventListener("click",function(){apply(id("rp-input").value);});
    var mx=id("rp-max");if(mx)mx.addEventListener("click",function(){id("rp-input").value=MAXPTS;apply(MAXPTS);});
    var rm=id("rp-remove");if(rm)rm.addEventListener("click",function(){id("rp-input").value="";applied=0;render();});
    render();
  })();

    --dark:#29272B;
    --border:#D4D3D5;
    --line:#E6E5E7;
    --white:#ffffff;
    --sans:"halyard-text",-apple-system,"Segoe UI",Arial,sans-serif;
    --serif:"ivypresto-display",Georgia,"Times New Roman",serif;
    --maxw:1776px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;font-family:var(--sans);font-size:16px;line-height:24px;color:var(--charcoal);background:var(--white);}
  a{color:var(--charcoal);text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 12px;}

  /* ===================== MINIMAL CHECKOUT HEADER ===================== */
  .co-header{border-bottom:1px solid var(--line);padding:26px 0;}
  .co-header .wrap{display:flex;justify-content:center;}
  .co-logo img{height:30px;width:auto;}

  /* ===================== SUCCESS ===================== */
  .success{padding:80px 0 90px;}
  .success-inner{max-width:640px;margin:0 auto;text-align:center;}
  .success-icon{width:92px;height:92px;margin:0 auto 30px;border-radius:50%;background:rgba(0,82,9,.08);display:flex;align-items:center;justify-content:center;}
  .success-icon svg{width:46px;height:46px;stroke:var(--green);fill:none;stroke-width:2.4;}
  .success-title{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1.1;color:var(--charcoal);margin:0 0 20px;}
  .success-title .g{color:var(--green);font-weight:700;}
  .success-lead{font-size:18px;line-height:28px;color:var(--charcoal);margin:0 auto 20px;max-width:560px;}
  .order-ref{display:inline-block;font-size:16px;color:var(--charcoal);background:#F4F4F5;border-radius:80px;padding:10px 22px;margin-bottom:8px;}
  .order-ref b{font-weight:700;}
  .success-note{font-size:16px;line-height:24px;color:#7a767e;margin:18px auto 34px;max-width:520px;}
  .success-note a{color:var(--green);font-weight:600;}

  /* order details card */
  .order-card{border:1px solid var(--border);border-radius:16px;background:#fff;padding:26px 28px;text-align:left;max-width:520px;margin:0 auto 38px;}
  .oc-item{display:flex;gap:18px;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid #ececed;}
  .oc-thumb{flex:none;width:76px;height:76px;border-radius:8px;overflow:hidden;background:#efeef0;}
  .oc-thumb img{width:100%;height:100%;object-fit:cover;}
  .oc-info{flex:1;min-width:0;}
  .oc-name{font-size:15px;font-weight:700;text-transform:uppercase;color:var(--charcoal);line-height:1.3;}
  .oc-attr{font-size:14px;color:var(--charcoal);margin:6px 0 0;}
  .oc-qty{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--charcoal);margin:8px 0 0;}
  .oc-qty span{font-weight:400;}
  .oc-rows{padding-top:18px;}
  .oc-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:8px 0;font-size:15px;color:var(--charcoal);}
  .oc-row .val{color:var(--green);white-space:nowrap;}
  .oc-row.total{border-top:1px solid #ececed;margin-top:8px;padding-top:14px;font-weight:700;}
  .oc-row.total .lbl,.oc-row.total .val{color:var(--green);text-transform:uppercase;}

  .success-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .btn-primary,.btn-outline{display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:16px;font-weight:500;line-height:1;padding:16px 32px;border-radius:80px;border:1.5px solid var(--green);cursor:pointer;text-decoration:none;transition:background-color .18s ease,color .18s ease;}
  .btn-primary{background:var(--green);color:#fff;gap:10px;}
  .btn-primary:hover{background:#00400a;border-color:#00400a;}
  .btn-primary svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;flex:none;}
  .btn-outline{background:transparent;color:var(--green);}
  .btn-outline:hover{background:var(--green);color:#fff;}

  /* minimal footer */
  .co-foot{border-top:1px solid var(--line);padding:22px 0;text-align:center;font-size:14px;color:#8a868f;}
  .co-foot a{color:#8a868f;margin:0 12px;}
  .co-foot a:hover{text-decoration:underline;}

  @media (max-width:600px){
    .wrap{padding:0 16px;}
    .success{padding:56px 0 64px;}
    .success-title{font-size:34px;}
    .success-lead{font-size:16px;line-height:24px;}
    .order-card{padding:20px;}
    .success-actions{flex-direction:column;}
    .btn-primary,.btn-outline{width:100%;}
  }
</style>
</head>
<body>

  <!-- ============ MINIMAL HEADER ============ -->
  <header class="co-header">
    <div class="wrap">
      <a class="co-logo" href="andover-infilta.html" aria-label="Bradstone">
        <img src="https://www.bradstone.com/static/version1788929388/frontend/bradstone/bradstone-commercial/en_GB/images/logo.svg" alt="Bradstone">
      </a>
    </div>
  </header>

  <!-- ============ ORDER SUCCESS ============ -->
  <main class="wrap success">
    <div class="success-inner">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <h1 class="success-title">Thank You for Your <span class="g">Purchase!</span></h1>
      <p class="success-lead">Your Order is Confirmed</p>

      <p class="success-note">We will email you an order confirmation with details and tracking information.</p>

      <div class="success-actions">
        <a class="btn-primary" href="#">Continue Shopping
          <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l7 6-7 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </div>
  </main>

  <!-- ============ MINIMAL FOOTER ============ -->
  <footer class="co-foot">
    ©2026 - Holcim UK Limited | Bradstone
    <span style="margin:0 6px;">·</span>
    <a href="#">Terms &amp; Conditions</a>
    <a href="#">Privacy Policy</a>
  </footer>

</body>
</html>
</script>

<script>
(function(){
  var PAGES={};
  document.querySelectorAll('script[type="text/html"]').forEach(function(s){
    PAGES[s.id.slice(2)] = s.textContent.replace(/<\\\/script/g,'<\/script');
  });
  var NAMES=Object.keys(PAGES);
  var HOME='andover-infilta';
  var stage=document.getElementById('stage');
  var current=null;

  var STYLE='<style>@keyframes __hsf{0%{box-shadow:0 0 0 2px rgba(30,120,255,.95),0 0 0 6px rgba(30,120,255,.30)}100%{box-shadow:0 0 0 2px rgba(30,120,255,0),0 0 0 16px rgba(30,120,255,0)}}.__hson{animation:__hsf 1s ease-out;}</style>';
  var SEL='a[data-nav], button[type=submit], .view-details, #rp-apply-btn, #rp-max, #rp-remove';
  var HELPER_BODY='(function(){var t;function fl(){var h=document.querySelectorAll(SEL_PLACEHOLDER);if(!h.length)return;var i;for(i=0;i<h.length;i++)h[i].classList.remove("__hson");void document.body.offsetWidth;for(i=0;i<h.length;i++)h[i].classList.add("__hson");clearTimeout(t);t=setTimeout(function(){var e=document.querySelectorAll(".__hson"),k;for(k=0;k<e.length;k++)e[k].classList.remove("__hson");},1100);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a"):null;if(a){var nav=a.getAttribute("data-nav");if(nav){e.preventDefault();parent.postMessage({__nav:nav},"*");fl();return;}if(a.getAttribute("href")==="#"){e.preventDefault();}}fl();});})();'.replace('SEL_PLACEHOLDER', '"'+SEL+'"');

  function process(html){
    NAMES.forEach(function(n){
      html=html.split('href="'+n+'.html"').join('href="#" data-nav="'+n+'"');
      html=html.split("window.location.href = '"+n+".html'").join("window.parent.postMessage({__nav:'"+n+"'},'*')");
    });
    var helper=STYLE+'<scr'+'ipt>'+HELPER_BODY+'</scr'+'ipt>';
    if(html.indexOf('</body>')>-1){html=html.replace('</body>',helper+'</body>');}else{html+=helper;}
    return html;
  }
  function show(name){
    if(!PAGES[name]) name=HOME;
    current=name;
    stage.srcdoc=process(PAGES[name]);
    if(location.hash.slice(1)!==name){location.hash=name;}
  }
  window.addEventListener('message',function(e){if(e.data&&e.data.__nav){show(e.data.__nav);}});
  window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h!==current){show(h);}});
  show(location.hash.slice(1)||HOME);
})();
</script>

</body>
</html>
